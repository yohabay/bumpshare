<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Receive a digital business card and save the contact without installing BumpShare">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </radialGradient>
    <linearGradient id="phone3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F8FF"/>
    </linearGradient>
    <linearGradient id="save3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="320" rx="48" fill="url(#bg3)"/>
  <circle cx="62" cy="68" r="104" fill="#DDD6FE" opacity="0.35"/>
  <circle cx="264" cy="258" r="116" fill="#C4B5FD" opacity="0.25"/>

  <!-- sparkles, matching the other onboarding screens -->
  <path d="M48 78 L52 66 L56 78 L68 82 L56 86 L52 98 L48 86 L36 82 Z" fill="#A78BFA" opacity="0.7"/>
  <path d="M272 236 L275 228 L278 236 L286 239 L278 242 L275 250 L272 242 L264 239 Z" fill="#8B5CF6" opacity="0.6"/>

  <!-- soft blue transfer glow between the card and phone -->
  <ellipse cx="168" cy="166" rx="72" ry="52" fill="url(#glow3)"/>
  <path d="M214 158 Q184 118 144 122" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M218 180 Q184 144 142 148" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="148" cy="128" r="3" fill="#3B82F6" opacity="0.7"/>
  <circle cx="168" cy="139" r="2.5" fill="#60A5FA" opacity="0.8"/>

  <!-- smartphone behind the card -->
  <g transform="rotate(-5 170 158)">
    <rect x="116" y="26" width="108" height="254" rx="24" fill="url(#phone3)"/>
    <rect x="122" y="38" width="96" height="230" rx="17" fill="#FFFFFF"/>
    <rect x="152" y="44" width="36" height="5" rx="2.5" fill="#EDE9FE"/>

    <!-- received badge -->
    <rect x="130" y="56" width="80" height="14" rx="7" fill="#EFF6FF"/>
    <circle cx="139" cy="63" r="3" fill="#3B82F6"/>
    <rect x="146" y="61" width="34" height="4" rx="2" fill="#93C5FD"/>
    <rect x="186" y="61" width="16" height="4" rx="2" fill="#3B82F6"/>

    <!-- contact profile -->
    <circle cx="170" cy="92" r="13" fill="#DBEAFE"/>
    <circle cx="170" cy="88" r="5" fill="#3B82F6"/>
    <path d="M160 102 Q170 95 180 102 Z" fill="#3B82F6"/>
    <rect x="150" y="110" width="40" height="6" rx="3" fill="#0F172A"/>
    <rect x="156" y="119" width="28" height="4" rx="2" fill="#3B82F6"/>

    <!-- contact rows -->
    <circle cx="136" cy="136" r="5" fill="#EFF6FF"/>
    <path d="M133 136 L136 139 L140 133" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="145" y="134" width="42" height="4" rx="2" fill="#CBD5E1"/>
    <circle cx="136" cy="149" r="5" fill="#EFF6FF"/>
    <circle cx="136" cy="149" r="2" fill="#2563EB"/>
    <rect x="145" y="147" width="34" height="4" rx="2" fill="#CBD5E1"/>
    <circle cx="136" cy="162" r="5" fill="#EFF6FF"/>
    <path d="M133 162 L139 162 M136 159 L136 165" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="145" y="160" width="38" height="4" rx="2" fill="#CBD5E1"/>

    <!-- social chips -->
    <circle cx="144" cy="180" r="7" fill="#EFF6FF"/>
    <circle cx="144" cy="180" r="2.5" fill="#3B82F6"/>
    <circle cx="164" cy="180" r="7" fill="#EFF6FF"/>
    <circle cx="164" cy="180" r="2.5" fill="#3B82F6"/>
    <circle cx="184" cy="180" r="7" fill="#EFF6FF"/>
    <circle cx="184" cy="180" r="2.5" fill="#3B82F6"/>

    <!-- prominent Save Contact action -->
    <rect x="132" y="220" width="76" height="26" rx="10" fill="url(#save3)"/>
    <path d="M147 225 L147 233 M143 229 L147 233 L151 229 M142 236 L152 236" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="158" y="228" width="34" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="158" y="235" width="22" height="3" rx="1.5" fill="#DBEAFE"/>
    <circle cx="205" cy="216" r="10" fill="#10B981"/>
    <path d="M200 216 L203.5 219.5 L210 212" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- premium business card in the foreground -->
  <g transform="rotate(-8 142 188)">
    <rect x="44" y="140" width="186" height="112" rx="17" fill="#1E3A8A" opacity="0.14"/>
    <rect x="38" y="134" width="186" height="112" rx="17" fill="url(#card3)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="38" y="150" width="4" height="78" rx="2" fill="#3B82F6"/>

    <!-- card header -->
    <rect x="52" y="148" width="15" height="15" rx="5" fill="#1D4ED8"/>
    <path d="M56.5 155.5 A2.5 2.5 0 0 1 61.5 155.5 M57.5 157.5 A2.5 2.5 0 0 0 60.5 157.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="74" y="150" width="34" height="5" rx="2.5" fill="#1E3A8A"/>
    <rect x="74" y="158" width="23" height="3.5" rx="1.75" fill="#93C5FD"/>
    <rect x="166" y="148" width="44" height="13" rx="6.5" fill="#EFF6FF"/>
    <circle cx="175" cy="154.5" r="2.5" fill="#3B82F6"/>
    <rect x="181" y="153" width="22" height="3" rx="1.5" fill="#93C5FD"/>

    <!-- profile and name -->
    <circle cx="66" cy="190" r="18" fill="#FFFFFF"/>
    <circle cx="66" cy="190" r="15" fill="#DBEAFE"/>
    <circle cx="66" cy="186" r="5.5" fill="#3B82F6"/>
    <path d="M54 201 Q66 190 78 201 Z" fill="#3B82F6"/>
    <rect x="92" y="181" width="58" height="6" rx="3" fill="#0F172A"/>
    <rect x="92" y="191" width="38" height="4" rx="2" fill="#64748B"/>
    <rect x="92" y="200" width="48" height="4" rx="2" fill="#3B82F6"/>

    <!-- contact lines -->
    <circle cx="59" cy="219" r="5" fill="#EFF6FF"/>
    <path d="M56 219 L59 222 L63 216" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="69" y="217" width="48" height="4" rx="2" fill="#CBD5E1"/>
    <circle cx="59" cy="232" r="5" fill="#EFF6FF"/>
    <circle cx="59" cy="232" r="2" fill="#2563EB"/>
    <rect x="69" y="230" width="40" height="4" rx="2" fill="#CBD5E1"/>

    <!-- social chips -->
    <circle cx="164" cy="224" r="7" fill="#EFF6FF"/>
    <circle cx="164" cy="224" r="2.5" fill="#3B82F6"/>
    <circle cx="182" cy="224" r="7" fill="#EFF6FF"/>
    <circle cx="182" cy="224" r="2.5" fill="#3B82F6"/>
    <circle cx="200" cy="224" r="7" fill="#EFF6FF"/>
    <circle cx="200" cy="224" r="2.5" fill="#3B82F6"/>
  </g>

  <!-- no-install reassurance -->
  <g>
    <rect x="22" y="252" width="92" height="28" rx="14" fill="#FFFFFF"/>
    <circle cx="39" cy="266" r="9" fill="#10B981"/>
    <path d="M35 266 L38 269 L43 263" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="54" y="262" width="42" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="54" y="270" width="30" height="3" rx="1.5" fill="#E2E8F0"/>
  </g>
</svg>
