<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6d28d9">
  <meta name="description" content="Get BumpShare — tap two phones to share a contact. No app needed to receive.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236d28d9' d='M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.6a3 3 0 1 1 4.3 4.3l-1.4 1.4a1 1 0 1 1-1.4-1.4l1.4-1.4a1 1 0 0 0-1.4-1.4l-3.6 3.5a1 1 0 0 1-1.4 0Zm2.8-2.8a1 1 0 0 1 0 1.4l-3.5 3.6a3 3 0 1 1-4.3-4.3l1.4-1.4a1 1 0 1 1 1.4 1.4l-1.4 1.4a1 1 0 0 0 1.4 1.4l3.6-3.5a1 1 0 0 1 1.4 0Z'/%3E%3C/svg%3E">
  <title>BumpShare — Get the app</title>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #6d28d9, #a78bfa);
      color: #1f1933;
    }
    .card {
      width: 100%; max-width: 420px; background: #fff; border-radius: 24px;
      padding: 32px; box-shadow: 0 20px 50px rgba(40, 20, 80, .25);
      text-align: center;
    }
    .brand { font-weight: 800; color: #6d28d9; letter-spacing: .04em; }
    h1 { margin: 18px 0 6px; font-size: 28px; }
    .hint { color: #6b6580; margin: 0 0 26px; font-size: 15px; line-height: 1.5; }
    .actions { display: grid; gap: 10px; }
    .button {
      display: block; text-align: center; text-decoration: none; padding: 14px 18px;
      border-radius: 14px; border: 0; font: inherit; font-weight: 700; cursor: pointer;
    }
    .primary { background: #6d28d9; color: #fff; }
    .secondary { background: #f3effc; color: #5b21b6; }
    .button[disabled] { opacity: .55; cursor: not-allowed; }
    .note { margin-top: 20px; font-size: 12px; color: #938ca6; line-height: 1.7; }
    .note a { color: #5b21b6; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">BUMP SHARE</div>
    <h1>Get BumpShare</h1>
    <p class="hint">Tap two phones to share a contact. The receiver needs no app and no account.</p>
    <div class="actions">
      <a class="button primary" data-store="google_play"
         href="https://play.google.com/store/apps/details?id=com.robatech.app"
         target="_blank"
         rel="noopener">
        Get it on Google Play
      </a>
      <button class="button secondary" type="button" data-store="app_store" disabled>
        Coming soon for iPhone
      </button>
    </div>
    <p class="note">
      iPhone users can already receive and save contacts by NFC.<br>
      <a href="/">Back to the contact page</a>
    </p>
  </main>
  <script>
    function trackEvent(name, data) {
      if (window.va) {
        try {
          if (data) window.va('event', { name, data });
          else window.va('event', { name });
        } catch (_) {}
      }
    }
    trackEvent('get_app_view');
    document.querySelectorAll('[data-store]').forEach(link => {
      link.addEventListener('click', () => {
        trackEvent('store_click', { store: link.getAttribute('data-store') || 'unknown' });
      });
    });
  </script>
</body>
</html>
